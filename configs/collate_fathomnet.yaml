# Paths moved to the workstation copy, 22 September 2026.
#
# source_root changed from N: to D:. This is SAFE and changes no UID:
# uid_for() hashes the path RELATIVE to source_root, so as long as the tree
# below it is identical -- which the copy guarantees -- every UID is unchanged.
# That is the same property that survived the NAS move in WP0b.
#
# Authoritative copies after this change:
#   raw/        NAS. The D: copy is read-only and refreshed NAS -> D:.
#   collated/   D:.  The NAS copy is a backup, pushed D: -> NAS after a build.

